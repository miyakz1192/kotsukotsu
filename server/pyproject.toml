[project]
name = "kotsukotsu-server"
version = "0.1.0"
description = "家庭内お小遣い学習ゲーム 管理サーバ"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
