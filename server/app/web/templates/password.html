{% extends "base.html" %}{% block title %}パスワード変更{% endblock %}
{% block body %}<div class="card" style="max-width:420px;margin:2rem auto"><h1>パスワード変更</h1>
{% if user.must_change_password %}<p class="flash err">初回ログインのため、パスワードの変更が必要です。</p>{% endif %}
<form method="post" action="/password" hx-boost="false">
<label>現在のパスワード</label><input name="current_password" type="password" required style="width:100%">
<label>新しいパスワード（8文字以上）</label><input name="new_password" type="password" minlength="8" required style="width:100%">
<label>新しいパスワード（確認）</label><input name="new_password2" type="password" minlength="8" required style="width:100%">
<p><button>変更する</button></p></form></div>{% endblock %}
