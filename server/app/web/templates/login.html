{% extends "base.html" %}{% block title %}ログイン{% endblock %}
{% block body %}<div class="card" style="max-width:380px;margin:3rem auto"><h1>ログイン</h1>
<form method="post" action="/login" hx-boost="false">
<label>ログインID</label><input name="login_id" autocomplete="username" required autofocus style="width:100%">
<label>パスワード</label><input name="password" type="password" autocomplete="current-password" required style="width:100%">
<p><button>ログイン</button></p></form>
<p class="mut">初回は、サーバ起動時にコンソールへ表示された初期管理者のIDとパスワードを使います。</p></div>{% endblock %}
