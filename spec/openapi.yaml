components:
  schemas:
    AdjustmentRequest:
      properties:
        adjustment_id:
          type: string
          maxLength: 64
          minLength: 8
          title: Adjustment Id
        child_user_id:
          type: string
          title: Child User Id
        points:
          type: integer
          title: Points
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        occurred_at_device:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At Device
          description: was_offline=true のとき台帳の発生時刻に使う（親用アプリの外出先での記録）
        was_offline:
          type: boolean
          title: Was Offline
          default: false
      type: object
      required:
      - adjustment_id
      - child_user_id
      - points
      title: AdjustmentRequest
    AdjustmentResponse:
      properties:
        adjustment_id:
          type: string
          title: Adjustment Id
        recorded_at:
          type: string
          format: date-time
          title: Recorded At
        balance:
          type: integer
          title: Balance
      type: object
      required:
      - adjustment_id
      - recorded_at
